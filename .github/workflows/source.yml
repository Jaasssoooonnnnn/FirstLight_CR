name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python tools/check_release.py
      - run: python -m compileall -q native_runner
      - run: python -m pytest native_runner/tests/test_offline_build.py native_runner/tests/test_offline_install.py native_runner/tests/test_contracts.py -q
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_install.py
      - run: python -m pytest native_runner/tests/test_competitive_data.py native_runner/tests/test_card_specs_ruleset.py native_runner/tests/test_timeline.py native_runner/tests/test_training_v4_learning.py native_runner/tests/test_training_v4_cache.py native_runner/tests/test_evaluate_and_serve.py -q
